name: "Deploy main"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  push:
    branches:
      - "main"

permissions:
  contents: "read"
  id-token: "write"
  packages: "write"

jobs:
  build-and-deploy:
    uses: navikt/tms-deploy/.github/workflows/astro-deploy-v1.yaml@main
    with:
      app-name: "tms-dokumentarkiv"
      clusters: '["dev-gcp", "prod-gcp"]'
    secrets: inherit
